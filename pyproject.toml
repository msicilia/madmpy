[project]
name = "madmpy"
version = "0.2.0"
description = "Creating and validating DMPs following the RDA Common Standard"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.4",
]

[dependency-groups]
# So that `uv run pytest` resolves to this project, not to whatever pytest is on PATH.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# An explicit list: a default sdist sweeps in everything git does not ignore. The
# leading slashes anchor each pattern to the project root.
include = [
    "/src/madmpy",
    "/data",
    "/docs",
    "/tests/test_validation.py",
    "/mkdocs.yml",
    "/requirements.txt",
    "/README.md",
    "/LICENSE",
]

[project.urls]
Documentation = "https://madmpy.readthedocs.io/en/latest/"
Repository = "https://github.com/msicilia/madmpy"
Issues = "https://github.com/msicilia/madmpy/issues"