[project]
name = "madmpy"
version = "0.2.0"
description = "Creating and validating DMPs following the RDA Common Standard"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.4",
]

[dependency-groups]
# Declared so that `uv run pytest` resolves to this project rather than to whatever
# pytest is on PATH, which would import a separately installed madmpy.
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source distribution ships an explicit list rather than whatever the working tree
# happens to hold. A default sdist sweeps in everything git does not ignore, which here
# meant local notes, a clone of the RDA's own repository and unrelated PDFs.
[tool.hatch.build.targets.sdist]
# The leading slashes anchor each pattern to the project root: unanchored, "docs" and
# "README.md" would also match those names inside any nested directory.
include = [
    "/src/madmpy",
    "/data",
    "/docs",
    "/tests/test_validation.py",
    "/mkdocs.yml",
    "/requirements.txt",
    "/README.md",
    "/LICENSE",
]

[project.urls]
Documentation = "https://madmpy.readthedocs.io/en/latest/"
Repository = "https://github.com/msicilia/madmpy"
Issues = "https://github.com/msicilia/madmpy/issues"